spring.application.name=recommendation-server
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/recommendation}
spring.datasource.username=${DATABASE_USERNAME:recommendation}
spring.datasource.password=${DATABASE_PASSWORD:recommendation-local}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jackson.property-naming-strategy=SNAKE_CASE
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.modulith.runtime.verification-enabled=true
platform.seed.config-path=${SEED_CONFIG_PATH:}
platform.admin.username=${ADMIN_USERNAME:admin}
platform.admin.password=${ADMIN_PASSWORD:admin}
