<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>꽃 추천 운영 대시보드</title>
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">TAEAN FLOWER · OPERATIONS</p><h1>꽃 추천 운영 대시보드</h1></div>
      <div class="controls"><input id="project" value="TAEAN_FLOWER_2026" aria-label="프로젝트 코드"><button id="refresh">새로고침</button></div>
    </header>
    <p class="notice">개인정보 내용은 표시하지 않습니다. 참여자가 선택한 동의 상태만 익명 집계합니다.</p>
    <section class="cards">
      <article><span>전체 추천</span><strong id="total">–</strong></article>
      <article class="green"><span>개인정보 동의</span><strong id="consented">–</strong><small id="consentRate">–</small></article>
      <article class="orange"><span>개인정보 미동의</span><strong id="declined">–</strong></article>
      <article><span>평균 스트레스</span><strong id="stress">–</strong><small>/ 100</small></article>
    </section>
    <section class="grid">
      <article class="panel"><div class="panel-title"><h2>감정별 추천</h2><span>누적</span></div><div id="emotions" class="bars"></div></article>
      <article class="panel"><div class="panel-title"><h2>동의 상태 구성</h2><span>익명</span></div><div id="consentChart" class="donut-wrap"></div></article>
    </section>
    <section class="panel table-panel"><div class="panel-title"><h2>최근 추천</h2><span id="updated">–</span></div>
      <div class="table-scroll"><table><thead><tr><th>시간</th><th>키오스크</th><th>감정</th><th>동의 상태</th><th>스트레스</th><th>처리</th></tr></thead><tbody id="recent"></tbody></table></div>
    </section>
    <p id="error" role="alert"></p>
  </main>
  <script src="/admin/app.js"></script>
</body>
</html>
