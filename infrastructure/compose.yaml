services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recommendation
      POSTGRES_USER: recommendation
      POSTGRES_PASSWORD: recommendation-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - recommendation-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommendation -d recommendation"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: ../services/server
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/recommendation
      DATABASE_USERNAME: recommendation
      DATABASE_PASSWORD: recommendation-local
      SEED_CONFIG_PATH: /config/project-config.json
    volumes:
      - ../projects/taean-flower/taean-flower-project-config.json:/config/project-config.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  recommendation-postgres:
